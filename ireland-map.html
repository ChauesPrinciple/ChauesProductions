<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Archaeology of Violence &amp; Myth &mdash; Ireland</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link

    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --bg: #0c2214;
            --panel: #102a1a;
            --card: #183826;
            --border: rgba(52, 211, 153, .12);

            --accent-dim: rgba(52, 211, 153, .18);

            --partner: #a78bfa;
            --cultural: #f59e0b;
            --festival: #ef4444;
            --finale: #fbbf24
        }

        html,
        body {
            height: 100%;
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: #94a8b3;
            overflow: hidden
        }

        body {
            display: flex
        }

        #sidebar {
            width: 320px;
            min-width: 320px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--panel);
            border-right: 1px solid var(--border);
            z-index: 10
        }

        #hdr {
            padding: 18px 22px 14px;
            border-bottom: 1px solid var(--border);
            background: var(--bg)
        }

        .eyebrow {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 5px
        }

        .trip-h {
            font-size: 17px;
            font-weight: 800;
            color: #fff;
            line-height: 1.25;
            margin-bottom: 4px
        }

        .trip-sub {
            font-size: 10px;
            color: var(--muted);
            margin-bottom: 10px
        }

        .prog-bar {
            height: 2px;
            border-radius: 1px;
            background: var(--border);
            margin-bottom: 6px
        }

        .prog-fill {
            height: 100%;
            border-radius: 1px;
            background: linear-gradient(90deg, var(--accent), #059669);
            transition: width .6s ease
        }

        .day-ctr {
            font-size: 9px;
            color: var(--muted);
            text-align: right;
            font-weight: 600;
            letter-spacing: .5px
        }

        #timeline {
            flex: 1;
            overflow-y: auto;
            padding: 12px 0 80px;
            scroll-behavior: smooth
        }

        #timeline::-webkit-scrollbar {
            width: 3px
        }

        #timeline::-webkit-scrollbar-thumb {
            background: var(--accent-dim);
            border-radius: 2px
        }

        .sec-label {
            padding: 14px 22px 5px;
            font-size: 8.5px;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--muted)
        }

        .day-card {
            position: relative;
            margin: 6px 12px;
            padding: 0;
            border-radius: 10px;
            background: var(--card);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all .15s ease;
            overflow: hidden
        }

        .day-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 0;
            background: var(--accent);
            border-radius: 10px 0 0 10px;
            transition: width .15s ease
        }

        .day-card:hover {
            border-color: rgba(52, 211, 153, .2);
            background: rgba(24, 56, 38, .9)
        }

        .day-card.active {
            border-color: rgba(52, 211, 153, .35);
            box-shadow: 0 0 20px rgba(52, 211, 153, .08)
        }

        .day-card.active::before {
            width: 4px
        }

        .card-img-wrap {
            position: relative;
            overflow: hidden;
            height: 80px
        }

        .card-img {
            width: 100%;
            height: 80px;
            object-fit: cover;
            display: block;
            opacity: .55;
            transition: opacity .3s;
            filter: saturate(.7)
        }

        .day-card:hover .card-img {
            opacity: .75
        }

        .card-img-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 30%, var(--card) 100%)
        }

        .card-top {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px 6px
        }

        .day-num {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1.5px solid rgba(52, 211, 153, .3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: var(--accent);
            flex-shrink: 0;
            transition: all .2s
        }

        .day-card.partner .day-num {
            border-color: rgba(167, 139, 250, .4);
            color: var(--partner)
        }

        .day-card.cultural .day-num {
            border-color: rgba(245, 158, 11, .4);
            color: var(--cultural)
        }

        .day-card.finale .day-num {
            border-color: rgba(251, 191, 36, .4);
            color: var(--finale)
        }

        .day-card.active .day-num {
            background: var(--accent);
            color: #000;
            border-color: var(--accent)
        }

        .day-card.active.partner .day-num {
            background: var(--partner);
            color: #000;
            border-color: var(--partner)
        }

        .day-card.active.cultural .day-num {
            background: var(--cultural);
            color: #000;
            border-color: var(--cultural)
        }

        .day-card.active.finale .day-num {
            background: var(--finale);
            color: #000;
            border-color: var(--finale)
        }

        .card-meta {
            flex: 1;
            min-width: 0
        }

        .card-date {
            font-size: 9px;
            color: var(--muted);
            margin-bottom: 1px
        }

        .card-loc {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .card-body {
            padding: 2px 14px 12px
        }

        .card-ttl {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 6px
        }

        .day-card.partner .card-ttl {
            color: var(--partner)
        }

        .day-card.cultural .card-ttl {
            color: var(--cultural)
        }

        .day-card.finale .card-ttl {
            color: var(--finale)
        }

        .evts {
            list-style: none;
            font-size: 10.5px;
            line-height: 1.55;
            color: #7a9990
        }

        .evts li {
            padding-left: 10px;
            position: relative
        }

        .evts li::before {
            content: '\00b7';
            position: absolute;
            left: 0;
            color: var(--accent);
            font-weight: 900
        }

        #map-wrap {
            flex: 1;
            position: relative
        }

        #map {
            width: 100%;
            height: 100%
        }

        #info {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 290px;
            z-index: 900;
            display: flex;
            flex-direction: column;
            pointer-events: none
        }

        #info-bar {
            background: rgba(12, 34, 20, .88);
            backdrop-filter: blur(14px);
            padding: 18px 20px 14px;
            border-bottom: 1px solid var(--border);
            border-left: 1px solid var(--border);

        .info-day-lbl {

            text-transform: uppercase;
            color: var(--accent);

        }

        .info-loc {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
            margin-bottom: 2px
        }

        .info-ttl {
            font-size: 11px;
            color: var(--muted);
            font-weight: 400
        }

        #info-text {
            background: rgba(12, 34, 20, .82);
            backdrop-filter: blur(14px);
            border-left: 1px solid var(--border);
            padding: 16px 20px 20px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            pointer-events: auto
        }

        #info-text::-webkit-scrollbar {
            width: 3px
        }

        #info-text::-webkit-scrollbar-thumb {
            background: var(--accent-dim);
            border-radius: 2px
        }

        #info-img {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 14px;
            border: 1px solid var(--border);
            display: block;
            transition: opacity .3s ease
        }

        .prose-p {
            font-family: 'Lato', serif;
            font-size: 13px;
            line-height: 1.7;
            color: #8a9e96;
            font-weight: 300;
            font-style: italic;
            margin-bottom: 10px

        .prose-p:last-child {

        }

        .prose-p strong {
            color: #d4dde8;
            font-weight: 400;
            font-style: italic
        }

        #legend {
            position: absolute;
            bottom: 24px;
            left: 16px;
            z-index: 1000;
            background: rgba(12, 34, 20, .88);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px 8px;
            font-size: 10px;
            color: var(--muted);

            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent);

        .leg-row {

            gap: 8px;
            margin-bottom: 4px
        }

        .leg-l {
            width: 22px;
            height: 2px;
            flex-shrink: 0

            height: 0;

        }

        .ct {
            background: rgba(12, 34, 20, .92) !important;
            border: 1px solid rgba(255, 255, 255, .1) !important;
            color: #fff !important;
            border-radius: 6px !important;
            font-size: 12px !important;

            font-weight: 600 !important;

        }

        .poi-tip {
            background: rgba(12, 34, 20, .92) !important;
            border: 1px solid rgba(255, 255, 255, .08) !important;
            color: #ccc !important;
            border-radius: 5px !important;
            font-size: 10px !important;
            padding: 3px 8px !important;
            font-weight: 500 !important;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .3) !important
        }

        #trip-nav {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 0;
            background: rgba(12, 34, 20, .88);
            border: 1px solid rgba(52, 211, 153, .2);
            border-radius: 22px;
            padding: 0;
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 12px rgba(0, 0, 0, .3);
            font-family: 'Inter', sans-serif
        }

        #trip-nav a {
            padding: 8px 16px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            text-decoration: none;
            color: rgba(52, 211, 153, .5);
            transition: all .2s ease;
            white-space: nowrap
        }

        #trip-nav a:first-child {
            border-radius: 22px 0 0 22px
        }

        #trip-nav a:last-child {
            border-radius: 0 22px 22px 0
        }

        #trip-nav a:hover {
            color: #34d399;
            background: rgba(52, 211, 153, .08)
        }

        #trip-nav a.active {
            color: #34d399;
            background: rgba(52, 211, 153, .15)
        }

        #trip-nav .sep {
            width: 1px;
            height: 18px;
            background: rgba(52, 211, 153, .2);
            flex-shrink: 0
        }

        .card-prose-mb {
            display: none
        }

        .leaflet-control-zoom a {
            background: var(--card) !important;
            color: #ccc !important;
            border-color: var(--border) !important
        }

        .leaflet-control-zoom a:hover {
            background: var(--card) !important;
            color: #fff !important
        }
    </style>
</head>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const I = { bog: 'assets/images/ireland_bog.png', blackthorn: 'assets/images/ireland_blackthorn.png', stonecircle: 'assets/images/ireland_stonecircle.png' };

        const SECTIONS = [
            {
                label: 'ARCHAEOLOGICAL & URBAN FOUNDATIONS', days: [
                    {
                        n: 1, date: 'Day 1', loc: 'Dublin', type: 'arrival', title: 'Dublin Arrival \u2014 The Sacralized King', img: I.bog,
                        lat: 53.3498, lng: -6.2603, zoom: 12, city: 'dublin',
                        events: ['Land at DUB, collect mid-sized SUV', 'National Museum of Ireland \u2014 Archaeology', '"Kingship and Sacrifice" exhibit: Old Croghan Man & Clonycavan Man', 'Bog bodies of failed kings: 6\'6" warriors ritually stabbed & drowned', 'Stay: South Dublin (Rathmines or D\u00fan Laoghaire)'],
                        prose: '<p class="prose-p">Proceed directly to the <strong>National Museum of Ireland \u2014 Archaeology</strong> and the <strong>"Kingship and Sacrifice"</strong> exhibit. Focus on <strong>Old Croghan Man and Clonycavan Man</strong>\u2014the bog bodies of failed kings, 6\'6" warriors with manicured nails and gripped-beast swords, ritually stabbed and drowned after losing sovereignty.</p><p class="prose-p">This is your baseline: <strong>the high-status warrior who is destroyed when he fails the goddess</strong>. The peat preserved everything\u2014the wounds, the bound arms, the last meal of buttermilk and cereals. Two thousand years in the dark, and the violence is still readable on the skin. Everything on this trip descends from this room.</p>'
                    },
                    {
                        n: 2, date: 'Day 2', loc: 'Dublin', type: 'cultural', title: 'Urban Grit & Viking Marshland',
                        lat: 53.3498, lng: -6.2603, zoom: 13, city: 'dublin',
                        events: ['The Liberties: scout 18th-century "Liberty Boys" street fighting territory', 'Fujifilm X-T2 Classic Chrome simulation: desaturated grit', 'Filming over Viking-era marshland\u2014layers of drained bog', 'Optional: local HEMA group session to prime mechanics', 'Stay: South Dublin'],
                        prose: '<p class="prose-p"><strong>The Liberties</strong> is the oldest neighbourhood in Dublin and the 18th-century territory of the <strong>"Liberty Boys"</strong>\u2014street gangs who fought pitched battles with shillelaghs and stones in the Coombe. Use the Fujifilm X-T2\'s <strong>Classic Chrome</strong> simulation to capture the desaturated grit\u2014but know you are filming over <strong>Viking-era marshland</strong>, layers of drained bog where the city sinks into its own foundation.</p><p class="prose-p">The street-fighting tradition here predates the faction fights by a century. The violence was territorial, ritualized, and celebrated. The paving stones you walk on cover the same waterlogged earth that preserved the bog bodies in the museum.</p>'
                    },
                ]
            },
            {
                label: 'THE BATAIREACHT SOURCE & FAIRY GUARDIANS', days: [
                    {
                        n: 3, date: 'Day 3', loc: 'Dublin \u2192 Shillelagh', type: 'travel', title: 'Through the Defensive Landscape', img: I.blackthorn,
                        lat: 53.0117, lng: -6.3275, zoom: 11, city: 'dublin',
                        events: ['Drive R755 through the Wicklow Mountains', 'Glendalough: 6th-century Round Tower\u2014defensive architecture masterclass', 'St. Kevin\'s Bed: Bronze Age cave where the saint lived', 'The Deer Stone: bullaun stone where women knelt to pray', 'Stay: Shillelagh village'],
                        prose: '<p class="prose-p">Drive the <strong>R755</strong> through the Wicklow Mountains\u2014the road itself is a transit through defensive landscape, granite passes that funnelled every invasion since the Vikings. <strong>Glendalough</strong> sits in a glacial valley: the 6th-century Round Tower is a masterclass in scale and lighting for your camera. But the layer beneath the Christian settlement is <strong>older, darker, more territorial</strong>.</p><p class="prose-p"><strong>St. Kevin\'s Bed</strong> is a Bronze Age cave 30 feet above the upper lake where the saint supposedly lived in solitude. The <strong>Deer Stone</strong> is a bullaun stone where women once knelt to pray for children. The sacred sites predate Christianity by millennia\u2014Kevin just moved in.</p>'
                    },
                    {
                        n: 4, date: 'Day 4', loc: 'Shillelagh', type: 'partner', title: 'The Loaded Grip & The Lunantishees',
                        lat: 52.7500, lng: -6.5333, zoom: 13, city: 'shillelagh',
                        events: ['Morning: 1-on-1 Bataireacht tactical session', 'Lead-hand "loaded" grip and high-guard defensive mechanics', 'Weapon source: blackthorn (Straif in Ogham)', 'Tree of the Morrigan and the Cailleach', 'Afternoon: Coolattin Woods\u2014old-growth blackthorn & oak', 'Lunantishees: moon fairies who guard the trees'],
                        prose: '<p class="prose-p">Private instruction in <strong>Bataireacht</strong>\u2014Irish Stick Fighting. Technical focus: the <strong>lead-hand "loaded" grip</strong> and high-guard defensive mechanics, the physics of managing reach with a blackthorn stick.</p><p class="prose-p">Your weapon source is <strong>blackthorn (<em>Straif</em> in Ogham)\u2014the "keeper and increaser of dark secrets."</strong> It is the tree of the <strong>Morrigan</strong> and the <strong>Cailleach</strong>, who strikes the ground with her blackthorn staff to summon winter. The thorns cause <strong>"blackthorn arthritis"</strong>\u2014septic wounds that dig deeper, the tips breaking off and migrating. This is the <strong>physical malice</strong> behind the folklore.</p><p class="prose-p"><strong>Coolattin Woods</strong> are the old-growth forests that supplied the blackthorn and oak. But the <strong>lunantishees</strong>\u2014moon fairies who are "no friends to humans"\u2014guard these trees. Harvest only at full moon, or they curse your bloodline.</p>'
                    },
                    {
                        n: 5, date: 'Day 5', loc: 'Shillelagh', type: 'cultural', title: 'Material Science & The Chimney Cure', img: I.blackthorn,
                        lat: 52.7500, lng: -6.5333, zoom: 14, city: 'shillelagh',
                        events: ['Master Stickmaker\'s Workshop (O\'Caidhla Family)', 'Blackthorn seasoning: 3-5 years, or the accelerated chimney cure', 'Butter and dung heaps, the "cubby hole up a chimney" for 12 months', 'The S\u00edol Ealaigh bloodline: seed of the original warrior lineage', 'Rucking: conditioning on local R-roads'],
                        prose: '<p class="prose-p">The <strong>O\'Caidhla family</strong> holds the <strong>S\u00edol Ealaigh</strong> bloodline\u2014the "seed of Ealach," the original warrior lineage that gave the village its name. Their workshop is the <strong>oral history repository</strong>, not a pub. The sound of the lathe is the sound of <strong>dying tradition</strong>.</p><p class="prose-p">Observe the <strong>blackthorn seasoning process</strong>\u20143-5 years for the O\'Caidhla method, or the <strong>accelerated folklore cure</strong>: butter and dung heaps, the "cubby hole up a chimney" for 12 months. This is the <strong>material science</strong> behind the weapon, but also the <strong>alchemy</strong>\u2014transforming living wood into dead weapon through fire, fat, and time.</p>'
                    },
                    {
                        n: 6, date: 'Day 6', loc: 'Shillelagh', type: 'cultural', title: 'The Dying Lineage & The Clearances',
                        lat: 52.7500, lng: -6.5333, zoom: 13, city: 'shillelagh',
                        events: ['Deep-dive: Doyle and Antrim oral lineages', 'Coolattin estate: Fitzwilliam systematic clearances during the Famine', 'S\u00edol Ealaigh warriors became landless laborers', 'Stick-fighting as last residue of martial identity', 'The O\'Caidhla workshop as mausoleum'],
                        prose: '<p class="prose-p">The <strong>Coolattin Woods</strong> were part of the <strong>Fitzwilliam estate</strong>, where tenants were systematically cleared during the Famine. The <strong>S\u00edol Ealaigh</strong> warriors became <strong>landless laborers</strong>, their stick-fighting tradition the last residue of martial identity after dispossession.</p><p class="prose-p">You are in the <strong>twilight of a bloodline</strong>. The Doyle system is preserved in Canada; the Antrim system fragments. What remains in Shillelagh is <strong>material culture without living practice</strong>\u2014the O\'Caidhla workshop as mausoleum. The Dying Cow Pub, or the Crossroads at Ballinakill, holds what oral tradition survives.</p>'
                    },
                ]
            },
            {
                label: 'REBEL SOUTH & THE LAST FACTION FIGHTS', days: [
                    {
                        n: 7, date: 'Day 7', loc: 'Shillelagh \u2192 Cork', type: 'travel', title: 'The Rebel Push',
                        lat: 51.8969, lng: -8.4863, zoom: 12, city: 'cork',
                        events: ['2.5-hour drive south into the heart of the "Rebel County"', 'Stay: Cork City center'],
                        prose: '<p class="prose-p">The drive south from Wicklow to <strong>Cork</strong> crosses the grain of Ireland\u2014through Carlow, Kilkenny, and the limestone uplands of Tipperary. You are leaving the <strong>source territory</strong> of the weapon and entering the <strong>performance territory</strong>\u2014where the stick was used.</p><p class="prose-p">Cork calls itself the <strong>"Rebel County"</strong> without irony. The rebellion tradition runs from the Desmond Wars through the War of Independence. The aggression is in the cadence of the speech, the pace of the streets, and the music.</p>'
                    },
                    {
                        n: 8, date: 'Day 8', loc: 'Cork', type: 'cultural', title: 'Aggressive Cadence & Underground Tunnels',
                        lat: 51.8969, lng: -8.4863, zoom: 13, city: 'cork',
                        events: ['Evening: Sin \u00c9 \u2014 traditional session', 'Aggressive cadence of the music mirrors strike-rhythm of Bata drills', '19th-century underground tunnels beneath old merchant quarters', 'Ballinhassig Faction Fight of June 30, 1845\u201411 dead', 'The end of the tradition: recreational violence crushed by state force'],
                        prose: '<p class="prose-p"><strong>Sin \u00c9</strong> is one of the best traditional music pubs in Ireland. The <strong>aggressive cadence</strong> of the music mirrors the <strong>strike-rhythm</strong> of the Bata drills\u2014the same tempo, the same controlled intensity. Beneath the city, <strong>19th-century underground tunnels</strong> run beneath the old merchant quarters\u2014Cork\'s literal underworld.</p><p class="prose-p">The <strong>Ballinhassig Faction Fight of June 30, 1845</strong>\u2014just before the Famine\u2014was one of the last major faction fights: 11 dead when police opened fire. This is the <strong>end of the tradition</strong>, the recreational violence of the "Culture of Honor" crushed by state force just as the Famine crushed the peasant class that sustained it.</p>'
                    },
                    {
                        n: 9, date: 'Day 9', loc: 'Cork / Midleton', type: 'cultural', title: 'Midleton Distillery & The American Oak',
                        lat: 51.9145, lng: -8.1728, zoom: 12, city: 'cork',
                        events: ['Day trip to Jameson Midleton Distillery', 'Pot-still distillation & ex-bourbon barrel maturation', 'Redbreast / Midleton Very Rare', 'Ex-bourbon barrels: the American thread\u2014same oak forests', 'Film: massive copper stills, industrial scale vs. rural woods', 'Return to Cork'],
                        prose: '<p class="prose-p"><strong>Jameson Midleton Distillery</strong> is the technical deep-dive: pot-still distillation and <strong>ex-bourbon barrel maturation</strong> (Redbreast, Midleton Very Rare). The <strong>oily, spicy kick</strong> that balances your preferred bourbons.</p><p class="prose-p">The <strong>ex-bourbon barrels</strong> are the <strong>American thread</strong>\u2014the same oak forests that supplied Irish whiskey staves now supply Kentucky. Your "warm summer day" bourbon profile is the <strong>transatlantic echo</strong> of the Coolattin woods, the blackthorn and oak traveling west while the stick-fighting tradition died out at home. The massive copper stills and industrial scale provide a visual counterpoint to the rural woods of Wicklow.</p>'
                    },
                ]
            },
            {
                label: 'THE WESTERN CORE & THE FAIRY QUEEN\'S LAKE', days: [
                    {
                        n: 10, date: 'Day 10', loc: 'Cork \u2192 Limerick', type: 'travel', title: 'Agrarian Violence & The Cailleach',
                        lat: 52.6638, lng: -8.6267, zoom: 11, city: 'limerick',
                        events: ['Drive northwest to the Shannon region', 'Day trip: Bunratty Castle & Folk Park', '19th-century rural village\u2014peak faction fighting era', 'Medieval Banquet: 15th-century castle under candlelight', 'Alternative: film the folk park\'s rural village after hours', 'Stay: Limerick'],
                        prose: '<p class="prose-p"><strong>Bunratty Castle & Folk Park</strong> reconstructs the <strong>19th-century rural village</strong>\u2014the exact period of peak faction fighting. This is <strong>agrarian life at the height of the stick-fighting tradition</strong>: not knights, but <strong>landless laborers</strong> with blackthorn sticks, fighting for reputation in fields and at fairs.</p><p class="prose-p">The <strong>Medieval Banquet</strong> is a 15th-century castle dinner under candlelight. Use the vaulted ceilings and period performance to test the low-light limits of your Fujifilm gear\u2014but the <strong>alternative</strong> is more honest: film the <strong>folk park\'s rural village after hours</strong>, the thatched cottages and mud walls where the Culture of Honor actually lived.</p>'
                    },
                    {
                        n: 11, date: 'Day 11', loc: 'Lough Gur', type: 'cultural', title: 'The Warrior Poet & The Raped Goddess', img: I.stonecircle,
                        lat: 52.5175, lng: -8.5317, zoom: 13, city: 'limerick',
                        events: ['Day trip from Limerick to Lough Gur', '9,000 years of habitation', '\u00c1ine\'s lake\u2014fairy queen forced into marriage, bit off the Earl\'s ear', 'Ge\u00e1roid Iarla: rides from the lake every 7 years on a white horse', 'Suideach\u00e1n Bean-t\u00ed: sit in the Housekeeper\'s Chair and lose your wits', 'Grange Stone Circle: 113 stones, 40-ton central stone', 'Rannach Crom Dubh\u2014the Division of the dark sacrifice god'],
                        prose: '<p class="prose-p"><strong>Lough Gur</strong> holds 9,000 years of habitation. The mythic layer: this is <strong>\u00c1ine\'s lake</strong>\u2014the fairy queen, goddess of love and summer, who was <strong>forced into marriage</strong> with the Earl of Desmond when he stole her cloak while she bathed. She <strong>bit off his ear</strong> (disqualifying him from kingship) and bore him a son, <strong>Ge\u00e1roid Iarla</strong>, who still rides from the lake on a white horse every seven years, his <strong>silver horseshoes</strong> slowly wearing down until he returns to restore the Desmonds.</p><p class="prose-p">\u00c1ine was also mistress to <strong>Crom Cruach</strong>, the "old black one eye of the many glooms"\u2014a deity of <strong>human sacrifice</strong>. The <strong>Suideach\u00e1n Bean-t\u00ed</strong> (Housekeeper\'s Chair) on Knockadoon is her birthing seat\u2014sit there, and tradition says you <strong>lose your wits entirely</strong>.</p><p class="prose-p"><strong>Grange Stone Circle (Lios na Grainsi)</strong> is the largest in Ireland\u2014113 stones, 4-meter central stone weighing 40 tons. This is your <strong>definitive "Warrior Poet" terrain</strong>\u2014rugged, silent, ancient. The largest stone is <strong>Rannach Crom Dubh</strong>\u2014the Division of Crom Dubh, the dark sacrifice god. Bronze Age shields were buried in this lake mud; kings were disqualified for missing ears. The circle is aligned with the <strong>summer solstice</strong>.</p>'
                    },
                    {
                        n: 12, date: 'Day 12', loc: 'Cashel \u2192 Dublin', type: 'finale', title: 'Iron Sword vs. Blackthorn Stick',
                        lat: 52.5200, lng: -7.8897, zoom: 11, city: 'limerick',
                        events: ['Day trip: Rock of Cashel\u2014seat of the High Kings', 'The final contrast: sacralized Iron Age warrior vs. dispossessed stick-fighter', 'The Cailleach strikes the ground with her blackthorn staff to begin winter', 'Drive to Dublin Airport, return vehicle', 'Prep for departure'],
                        prose: '<p class="prose-p"><strong>The Rock of Cashel</strong> is the seat of the High Kings\u2014the <strong>final contrast</strong> in your visual story: the <strong>high-status warrior of the Iron Age</strong> (the bog body kings, the sacralized violence of sovereignty) vs. the <strong>marginalized "Culture of Honor" fighter</strong> of the 19th century (the stick-fighter, the recreational violence of the dispossessed).</p><p class="prose-p">The <strong>Cailleach</strong> strikes the ground with her blackthorn staff to begin winter. You have traced the weapon from <strong>fairy-guarded wood</strong> to <strong>chimney-cured stick</strong>, from <strong>S\u00edol Ealaigh lineage</strong> to <strong>dying tradition</strong>. The Rock of Cashel is where the sacralized king was destroyed when he failed\u2014the bog bodies in the museum are the <strong>negative image</strong> of the stick-fighter who fought for reputation alone.</p>'
                    },
                ]
            },
        ];
        const ALL = SECTIONS.flatMap(s => s.days);

        /* ROUTES */
        const WICKLOW = [[53.3498, -6.2603], [53.2027, -6.0987], [53.0608, -6.2222], [53.0117, -6.3275], [52.9308, -6.2283], [52.7500, -6.5333]];
        const SOUTH = [[52.7500, -6.5333], [52.8408, -6.9261], [52.6542, -7.2522], [52.3800, -7.7500], [51.8969, -8.4863]];
        const MIDLETON_RD = [[51.8969, -8.4863], [51.9145, -8.1728]];
        const WEST = [[51.8969, -8.4863], [52.2000, -8.6200], [52.6638, -8.6267]];
        const LOUGHGUR_RD = [[52.6638, -8.6267], [52.5175, -8.5317]];
        const RET = [[52.6638, -8.6267], [52.5200, -7.8897], [52.8408, -6.9261], [53.1500, -6.5500], [53.3498, -6.2603]];

        const BOUNDS = L.latLngBounds([51.0, -11.0], [55.5, -5.0]);
        const map = L.map('map', { center: [53.0, -7.5], zoom: 7, minZoom: 6, maxZoom: 16, zoomControl: false, maxBounds: BOUNDS, maxBoundsViscosity: 0.85 });
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://openstreetmap.org">OSM</a> &copy; <a href="https://carto.com">CARTO</a>',
            subdomains: 'abcd', maxZoom: 19
        }).addTo(map);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        /* Dim routes */
        const dim = { color: '#1a3d2a', weight: 1.5, opacity: 0.5 };
        const scenicDim = { color: '#1a3d2a', weight: 1.2, opacity: 0.4, dashArray: '4,6' };
        L.polyline(WICKLOW, scenicDim).addTo(map);
        L.polyline(SOUTH, dim).addTo(map);
        L.polyline(MIDLETON_RD, dim).addTo(map);
        L.polyline(WEST, dim).addTo(map);
        L.polyline(LOUGHGUR_RD, dim).addTo(map);
        L.polyline(RET, dim).addTo(map);

        /* Active routes */
        const aMain = L.polyline([], { color: '#059669', weight: 3.5, opacity: 0.95, lineCap: 'round' }).addTo(map);
        const aScenic = L.polyline([], { color: '#34d399', weight: 3, opacity: 0.95, dashArray: '6,8', lineCap: 'round' }).addTo(map);

        const ROUTE_SEGS = [
            { day: 1, m: [], s: [] },
            { day: 3, m: [], s: WICKLOW },
            { day: 7, m: SOUTH, s: WICKLOW },
            { day: 9, m: [...SOUTH, ...MIDLETON_RD], s: WICKLOW },
            { day: 10, m: [...SOUTH, ...MIDLETON_RD, ...WEST], s: WICKLOW },
            { day: 11, m: [...SOUTH, ...MIDLETON_RD, ...WEST, ...LOUGHGUR_RD], s: WICKLOW },
            { day: 12, m: [...SOUTH, ...MIDLETON_RD, ...WEST, ...LOUGHGUR_RD, ...RET], s: WICKLOW },
        ];
        function updateRoute(n) { let seg = ROUTE_SEGS[0]; for (let i = 0; i < ROUTE_SEGS.length; i++) { if (n >= ROUTE_SEGS[i].day) seg = ROUTE_SEGS[i]; } aMain.setLatLngs(seg.m); aScenic.setLatLngs(seg.s); }

        /* STAY CITIES (overnight) */
        const CITIES = {
            dublin: { lat: 53.3498, lng: -6.2603, name: 'Dublin' },
            shillelagh: { lat: 52.7500, lng: -6.5333, name: 'Shillelagh' },
            cork: { lat: 51.8969, lng: -8.4863, name: 'Cork' },
            limerick: { lat: 52.6638, lng: -8.6267, name: 'Limerick' },
        };
        const cMkrs = {};
        Object.entries(CITIES).forEach(([k, c]) => {
            const m = L.circleMarker([c.lat, c.lng], { radius: 7, fillColor: '#059669', color: 'rgba(5,150,105,0.4)', weight: 8, opacity: 1, fillOpacity: 0.95 }).addTo(map);
            m.bindTooltip('<b>' + c.name + '</b>', { className: 'ct', permanent: false, direction: 'top' });
            m.on('click', () => { const d = ALL.filter(x => x.city === k); if (d.length > 0) { const cl = d.reduce((p, c) => Math.abs(c.n - activeDay) < Math.abs(p.n - activeDay) ? c : p); scrollTo(cl.n); } });
            cMkrs[k] = m;
        });

        /* POI MARKERS (places you visit / things you do) */
        const POIS = [
            { lat: 53.3405, lng: -6.2554, name: 'National Museum', color: '#ef4444' },
            { lat: 53.3382, lng: -6.2828, name: 'The Liberties', color: '#ef4444' },
            { lat: 53.0117, lng: -6.3275, name: 'Glendalough', color: '#ef4444' },
            { lat: 52.7600, lng: -6.5200, name: 'Coolattin Woods', color: '#34d399' },
            { lat: 51.9020, lng: -8.4700, name: 'Sin \u00c9', color: '#f59e0b' },
            { lat: 51.9145, lng: -8.1728, name: 'Midleton Distillery', color: '#f59e0b' },
            { lat: 52.6978, lng: -8.8081, name: 'Bunratty Castle', color: '#ef4444' },
            { lat: 52.5175, lng: -8.5317, name: 'Lough Gur / Grange Circle', color: '#34d399' },
            { lat: 52.5200, lng: -7.8897, name: 'Rock of Cashel', color: '#ef4444' },
        ];
        POIS.forEach(p => {
            const m = L.circleMarker([p.lat, p.lng], { radius: 4, fillColor: p.color, color: p.color, weight: 1.5, opacity: 0.8, fillOpacity: 0.7 }).addTo(map);
            m.bindTooltip(p.name, { className: 'poi-tip', permanent: false, direction: 'top' });
        });

        /* BUILD TIMELINE */
        const tl = document.getElementById('timeline');
        SECTIONS.forEach(sec => {
            const wrap = document.createElement('div');
            const lbl = document.createElement('div');
            lbl.className = 'sec-label'; lbl.textContent = sec.label; wrap.appendChild(lbl);
            sec.days.forEach(d => {
                const card = document.createElement('div');
                card.className = 'day-card ' + d.type;
                card.id = 'd' + d.n;
                card.dataset.n = d.n;
                card.setAttribute('role', 'button');
                card.setAttribute('tabindex', '0');
                card.innerHTML = (d.img ? '<div class="card-img-wrap"><img class="card-img" src="' + d.img + '" alt="' + d.loc + '" loading="lazy"><div class="card-img-overlay"></div></div>' : '') +
                    '<div class="card-top"><div class="day-num">' + d.n + '</div><div class="card-meta"><div class="card-date">' + d.date + '</div><div class="card-loc">' + d.loc + '</div></div></div>' +
                    '<div class="card-body"><div class="card-ttl">' + d.title + '</div><ul class="evts">' + d.events.map(function (e) { return '<li>' + e + '</li>'; }).join('') + '</ul></div>' +
                    '<div class="card-prose-mb">' + (d.prose || '') + '</div>';
                card.addEventListener('click', function () { activate(d.n, true); });
                card.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(d.n, true); } });
                wrap.appendChild(card);
            });
            tl.appendChild(wrap);
        });

        /* STATE */
        var activeDay = 0, lastCity = '';
        var obs = new IntersectionObserver(function (entries) {
            entries.forEach(function (e) { if (e.isIntersecting) { var n = parseInt(e.target.dataset.n); if (n !== activeDay) activate(n, false); } });
        }, { root: document.getElementById('timeline'), rootMargin: '-10% 0px -70% 0px', threshold: 0 });
        document.querySelectorAll('.day-card').forEach(function (c) { obs.observe(c); });

        function activate(n, scroll) {
            activeDay = n;
            var day = ALL.find(function (d) { return d.n === n; }); if (!day) return;
            document.querySelectorAll('.day-card').forEach(function (c) { c.classList.remove('active'); });
            var card = document.getElementById('d' + n);
            if (card) { card.classList.add('active'); if (scroll) card.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
            if (day.city !== lastCity) {
                map.flyTo([day.lat, day.lng], day.zoom, { duration: 1.1, easeLinearity: 0.25 });
                lastCity = day.city;
                Object.entries(cMkrs).forEach(function (e) { var k = e[0], m = e[1]; m.setStyle(k === day.city ? { radius: 9, fillColor: '#059669', color: 'rgba(5,150,105,0.6)', weight: 10, fillOpacity: 1 } : { radius: 7, fillColor: '#059669', color: 'rgba(5,150,105,0.4)', weight: 8, fillOpacity: 0.95 }); });
            }
            updateRoute(n);
            document.getElementById('ib-day').textContent = 'Day ' + n;
            document.getElementById('ib-loc').textContent = day.loc;
            document.getElementById('ib-ttl').textContent = day.title;
            var imgEl = document.getElementById('info-img');
            if (day.img) { imgEl.style.display = 'block'; if (imgEl.src !== day.img) { imgEl.style.opacity = 0; setTimeout(function () { imgEl.src = day.img; imgEl.alt = day.loc; imgEl.style.opacity = 1; }, 200); } }
            else { imgEl.style.display = 'none'; }
            document.getElementById('info-prose').innerHTML = (day.prose || '');
            var pct = ((n - 1) / (ALL.length - 1)) * 100;
            document.getElementById('prog-fill').style.width = pct + '%';
            document.getElementById('day-ctr').textContent = 'Day ' + n + ' of ' + ALL.length;
        }
        function scrollTo(n) { var c = document.getElementById('d' + n); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'center' }); activate(n, false); }
        setTimeout(function () { activate(1, false); }, 300);
    </script>
</body>
