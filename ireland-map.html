<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Archaeology of Violence &amp; Myth &mdash; Ireland</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Lato:ital,wght@0,300;1,300&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        *,
        *::before,
        *::after {
            box-sizing: border-box;
            margin: 0;
            padding: 0
        }

        :root {
            --bg: #0c2214;
            --panel: #102a1a;
            --card: #183826;
            --border: rgba(52, 211, 153, .12);
            --accent: #34d399;
            --accent-dim: rgba(52, 211, 153, .18);
            --muted: #6aaa85;
            --partner: #a78bfa;
            --cultural: #f59e0b;
            --festival: #ef4444;
            --finale: #fbbf24
        }

        html,
        body {
            height: 100%;
            height: 100vh;
            height: 100dvh;
            font-family: 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: #94a8b3;
            overflow: hidden
        }

        body {
            display: flex
        }

        #sidebar {
            width: 320px;
            min-width: 320px;
            height: 100%;
            display: flex;
            flex-direction: column;
            background: var(--panel);
            border-right: 1px solid var(--border);
            z-index: 10
        }

        #hdr {
            padding: 18px 22px 14px;
            border-bottom: 1px solid var(--border);
            background: var(--bg)
        }

        .eyebrow {
            font-size: 9px;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 5px
        }

        .trip-h {
            font-size: 17px;
            font-weight: 800;
            color: #fff;
            line-height: 1.25;
            margin-bottom: 4px
        }

        .trip-sub {
            font-size: 10px;
            color: var(--muted);
            margin-bottom: 10px
        }

        .prog-bar {
            height: 2px;
            border-radius: 1px;
            background: var(--border);
            margin-bottom: 6px
        }

        .prog-fill {
            height: 100%;
            border-radius: 1px;
            background: linear-gradient(90deg, var(--accent), #059669);
            transition: width .6s ease
        }

        .day-ctr {
            font-size: 9px;
            color: var(--muted);
            text-align: right;
            font-weight: 600;
            letter-spacing: .5px
        }

        #timeline {
            flex: 1;
            overflow-y: auto;
            padding: 12px 0 60vh;
            scroll-behavior: smooth
        }

        #timeline::-webkit-scrollbar {
            width: 3px
        }

        #timeline::-webkit-scrollbar-thumb {
            background: var(--accent-dim);
            border-radius: 2px
        }

        .sec-label {
            padding: 14px 22px 5px;
            font-size: 8.5px;
            font-weight: 700;
            letter-spacing: 2.5px;
            text-transform: uppercase;
            color: var(--muted)
        }

        .day-card {
            position: relative;
            margin: 6px 12px;
            padding: 0;
            border-radius: 10px;
            background: var(--card);
            border: 1px solid var(--border);
            cursor: pointer;
            transition: all .15s ease;
            overflow: hidden
        }

        .day-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            bottom: 0;
            width: 0;
            background: var(--accent);
            border-radius: 10px 0 0 10px;
            transition: width .15s ease
        }

        .day-card:hover {
            border-color: rgba(52, 211, 153, .2);
            background: rgba(24, 56, 38, .9)
        }

        .day-card.active {
            border-color: rgba(52, 211, 153, .35);
            box-shadow: 0 0 20px rgba(52, 211, 153, .08)
        }

        .day-card.active::before {
            width: 4px
        }

        .card-img-wrap {
            position: relative;
            overflow: hidden;
            height: 80px
        }

        .card-img {
            width: 100%;
            height: 80px;
            object-fit: cover;
            display: block;
            opacity: .55;
            transition: opacity .3s;
            filter: saturate(.7)
        }

        .day-card:hover .card-img {
            opacity: .75
        }

        .card-img-overlay {
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, transparent 30%, var(--card) 100%)
        }

        .card-top {
            display: flex;
            align-items: center;
            gap: 10px;
            padding: 12px 14px 6px
        }

        .day-num {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            border: 1.5px solid rgba(52, 211, 153, .3);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            font-weight: 700;
            color: var(--accent);
            flex-shrink: 0;
            transition: all .2s
        }

        .day-card.partner .day-num {
            border-color: rgba(167, 139, 250, .4);
            color: var(--partner)
        }

        .day-card.cultural .day-num {
            border-color: rgba(245, 158, 11, .4);
            color: var(--cultural)
        }

        .day-card.finale .day-num {
            border-color: rgba(251, 191, 36, .4);
            color: var(--finale)
        }

        .day-card.active .day-num {
            background: var(--accent);
            color: #000;
            border-color: var(--accent)
        }

        .day-card.active.partner .day-num {
            background: var(--partner);
            color: #000;
            border-color: var(--partner)
        }

        .day-card.active.cultural .day-num {
            background: var(--cultural);
            color: #000;
            border-color: var(--cultural)
        }

        .day-card.active.finale .day-num {
            background: var(--finale);
            color: #000;
            border-color: var(--finale)
        }

        .card-meta {
            flex: 1;
            min-width: 0
        }

        .card-date {
            font-size: 9px;
            color: var(--muted);
            margin-bottom: 1px
        }

        .card-loc {
            font-size: 13px;
            font-weight: 700;
            color: #fff;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis
        }

        .card-body {
            padding: 2px 14px 12px
        }

        .card-ttl {
            font-size: 11px;
            font-weight: 600;
            color: var(--accent);
            margin-bottom: 6px
        }

        .day-card.partner .card-ttl {
            color: var(--partner)
        }

        .day-card.cultural .card-ttl {
            color: var(--cultural)
        }

        .day-card.finale .card-ttl {
            color: var(--finale)
        }

        .evts {
            list-style: none;
            font-size: 10.5px;
            line-height: 1.55;
            color: #7a9990
        }

        .evts li {
            padding-left: 10px;
            position: relative
        }

        .evts li::before {
            content: '\00b7';
            position: absolute;
            left: 0;
            color: var(--accent);
            font-weight: 900
        }

        #map-wrap {
            flex: 1;
            position: relative
        }

        #map {
            width: 100%;
            height: 100%
        }

        #info {
            position: absolute;
            top: 0;
            right: 0;
            bottom: 0;
            width: 290px;
            z-index: 900;
            display: flex;
            flex-direction: column;
            pointer-events: none
        }

        #info-bar {
            background: rgba(12, 34, 20, .88);
            backdrop-filter: blur(14px);
            padding: 18px 20px 14px;
            border-bottom: 1px solid var(--border);
            border-left: 1px solid var(--border);
            pointer-events: auto
        }

        .info-day-lbl {
            font-size: 8.5px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 3px
        }

        .info-loc {
            font-size: 22px;
            font-weight: 800;
            color: #fff;
            line-height: 1.2;
            margin-bottom: 2px
        }

        .info-ttl {
            font-size: 11px;
            color: var(--muted);
            font-weight: 400
        }

        #info-text {
            background: rgba(12, 34, 20, .82);
            backdrop-filter: blur(14px);
            border-left: 1px solid var(--border);
            padding: 16px 20px 20px;
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            pointer-events: auto
        }

        #info-text::-webkit-scrollbar {
            width: 3px
        }

        #info-text::-webkit-scrollbar-thumb {
            background: var(--accent-dim);
            border-radius: 2px
        }

        #info-img {
            width: 100%;
            border-radius: 8px;
            margin-bottom: 14px;
            border: 1px solid var(--border);
            display: block;
            transition: opacity .3s ease
        }

        .prose-p {
            font-family: 'Lato', serif;
            font-size: 13px;
            line-height: 1.7;
            color: #8a9e96;
            font-weight: 300;
            font-style: italic;
            margin-bottom: 10px
        }

        .prose-p:last-child {
            margin-bottom: 0
        }

        .prose-p strong {
            color: #d4dde8;
            font-weight: 400;
            font-style: italic
        }

        #legend {
            position: absolute;
            bottom: 24px;
            left: 16px;
            z-index: 1000;
            background: rgba(12, 34, 20, .88);
            backdrop-filter: blur(14px);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 10px 14px 8px;
            font-size: 10px;
            color: var(--muted);
            box-shadow: 0 2px 12px rgba(0, 0, 0, .3);
            pointer-events: auto;
        }

        .leg-h {
            font-size: 8px;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: var(--accent);
            margin-bottom: 6px
        }

        .leg-row {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-bottom: 4px
        }

        .leg-l {
            width: 22px;
            height: 2px;
            flex-shrink: 0
        }

        .leg-ld {
            width: 22px;
            height: 0;
            border-top: 2px dashed;
            flex-shrink: 0
        }

        .leg-poi {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            flex-shrink: 0;
            border: 1.5px solid
        }

        .ct {
            background: rgba(12, 34, 20, .92) !important;
            border: 1px solid rgba(255, 255, 255, .1) !important;
            color: #fff !important;
            border-radius: 6px !important;
            font-size: 12px !important;
            padding: 4px 10px !important;
            font-weight: 600 !important;
            box-shadow: 0 4px 16px rgba(0, 0, 0, .3) !important
        }

        .poi-tip {
            background: rgba(12, 34, 20, .92) !important;
            border: 1px solid rgba(255, 255, 255, .08) !important;
            color: #ccc !important;
            border-radius: 5px !important;
            font-size: 10px !important;
            padding: 3px 8px !important;
            font-weight: 500 !important;
            box-shadow: 0 2px 8px rgba(0, 0, 0, .3) !important
        }

        #trip-nav {
            position: absolute;
            bottom: 14px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            display: flex;
            align-items: center;
            gap: 0;
            background: rgba(12, 34, 20, .88);
            border: 1px solid rgba(52, 211, 153, .2);
            border-radius: 22px;
            padding: 0;
            backdrop-filter: blur(10px);
            box-shadow: 0 2px 12px rgba(0, 0, 0, .3);
            font-family: 'Inter', sans-serif

        #trip-nav a {
            padding: 8px 16px;
            font-size: 10px;
            font-weight: 600;
            letter-spacing: .08em;
            text-transform: uppercase;
            text-decoration: none;
            color: rgba(52, 211, 153, .5);
            transition: all .2s ease;
            white-space: nowrap
        }

        #trip-nav a:first-child {
            border-radius: 22px 0 0 22px
        }

        #trip-nav a:last-child {
            border-radius: 0 22px 22px 0
        }

        #trip-nav a:hover {
            color: #34d399;
            background: rgba(52, 211, 153, .08)
        }

        #trip-nav a.active {
            color: #34d399;
            background: rgba(52, 211, 153, .15)
        }

        #trip-nav .sep {
            width: 1px;
            height: 18px;
            background: rgba(52, 211, 153, .2);
            flex-shrink: 0
        }

        .card-prose-mb {
            display: none;
            padding: 0 14px 14px;
            font-size: 13px;
            line-height: 1.6;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            margin-top: 4px;
            padding-top: 12px;
        }

        .leaflet-control-zoom a {
            background: var(--card) !important;
            color: #ccc !important;
            border-color: var(--border) !important
        }

        .leaflet-control-zoom a:hover {
            background: var(--card) !important;
            color: #fff !important
        }

        #map .leaflet-tile-pane {
            filter: invert(0.9) hue-rotate(180deg) sepia(1) hue-rotate(50deg) saturate(4);
        }

        .leaflet-control-attribution {
            font-size: 8px !important;

            color: rgba(255, 255, 255, 0.5) !important;

            transition: opacity 0.2s;
        }

        .leaflet-control-attribution:hover {

        }

        .leaflet-control-attribution a {
            color: rgba(255, 255, 255, 0.6) !important;
        }

        .cta-card {
            margin: 24px 16px 12px;
            padding: 28px 20px;

            border-radius: 12px;

        }

        .cta-card h3 {
            font-size: 16px;
            color: var(--accent);
            margin: 0 0 8px;
            font-weight: 700;
            letter-spacing: 0.5px;
        }

        .cta-card p {
            font-size: 12px;
            color: var(--muted);
            margin: 0 0 16px;
            line-height: 1.5;
        }

        .cta-btn {
            display: inline-block;
            padding: 10px 28px;
            background: var(--accent);
            color: #fff;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
            border-radius: 6px;
            letter-spacing: 0.5px;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .cta-btn:hover {
            transform: translateY(-1px);
            box-shadow: 0 4px 16px rgba(5, 150, 105, 0.4);
        }

        @media(max-width:760px) {
            body {
                flex-direction: column !important;
            }

            #sidebar {
                width: 100% !important;
                min-width: 100% !important;
                height: 50vh !important;
                height: 50dvh !important;
            }

            #timeline {
                padding-bottom: 25vh !important;
            }

            #map-wrap {
                width: 100% !important;
                height: 50vh !important;
                height: 50dvh !important;
                flex: none !important;
            }

            .day-card.active .card-prose-mb {
                display: block;
            }

            #info {
                display: none !important;
            }

            #trip-nav {
                position: fixed;
                bottom: 24px;
                left: 50%;
                transform: translateX(-50%);
                z-index: 1000;
            }

            #legend {
                bottom: 74px;
            }
        }

        details#legend-details summary::-webkit-details-marker {

        }

        details#legend-details summary {

            cursor: pointer;

        details#legend-details summary::after {

        }

        }

            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(150, 150, 150, 0.2);
        }
    </style>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        const I = { bog: 'assets/images/ireland_bog.png', blackthorn: 'assets/images/ireland_blackthorn.png', stonecircle: 'assets/images/ireland_stonecircle.png' };

        const SECTIONS = [
            {
                label: 'ARCHAEOLOGICAL & URBAN FOUNDATIONS', days: [
                    {
                        n: 1, date: 'Day 1', loc: 'Dublin', type: 'arrival', title: 'Dublin Arrival \u2014 The Sacralized King', img: I.bog,
                        lat: 53.3498, lng: -6.2603, zoom: 12, city: 'dublin',
                        events: ['Land at DUB, collect mid-sized SUV', 'National Museum of Ireland \u2014 Archaeology', '"Kingship and Sacrifice" exhibit: Old Croghan Man & Clonycavan Man', 'Bog bodies of failed kings: 6\'6" warriors ritually stabbed & drowned', 'Stay: South Dublin (Rathmines or D\u00fan Laoghaire)'],
                        prose: '<p class="prose-p">We begin at the <strong>National Museum of Ireland \u2014 Archaeology</strong> and the <strong>"Kingship and Sacrifice"</strong> exhibit. Standing in front of <strong>Old Croghan Man and Clonycavan Man</strong> is the moment the trip becomes real. These are Iron Age kings\u2014tall, powerful men who were ritually killed when they failed the land. The peat preserved everything: the wounds, the bound arms, the last meal of buttermilk and cereals. Two thousand years in the dark, and the violence is still readable on the skin.</p><p class="prose-p">This room sets the thesis for everything that follows. The warrior who was sacred when he succeeded and destroyed when he failed\u2014that arc runs through every site we visit, from the old-growth forests of Wicklow to the faction-fight fields of Munster. If you have read Seamus Heaney\'s <em>Bog Poems</em>, this is where those poems live.</p>'
                    },
                    {
                        n: 2, date: 'Day 2', loc: 'Dublin', type: 'cultural', title: 'Urban Grit & Viking Marshland',
                        lat: 53.3498, lng: -6.2603, zoom: 13, city: 'dublin',
                        events: ['The Liberties: scout 18th-century "Liberty Boys" street fighting territory', 'Fujifilm X-T2 Classic Chrome simulation: desaturated grit', 'Filming over Viking-era marshland\u2014layers of drained bog', 'Optional: local HEMA group session to prime mechanics', 'Stay: South Dublin'],
                        prose: '<p class="prose-p">We walk <strong>The Liberties</strong>, Dublin\'s oldest neighbourhood and the 18th-century territory of the <strong>"Liberty Boys"</strong>\u2014street gangs who fought pitched battles with shillelaghs and stones in the Coombe. The streets sit on <strong>Viking-era marshland</strong>, layers of drained bog where the city literally sinks into its own foundation. The paving stones you walk on cover the same waterlogged earth that preserved the bog bodies in the museum.</p><p class="prose-p">The street-fighting tradition here predates the rural faction fights by a century. If you are interested in filming, this is extraordinary terrain\u2014gritty, layered, atmospheric. For everyone, it is a walk through the living archaeology of urban violence that connects directly to the martial culture we trace south into Wicklow and beyond.</p>'
                    },
                ]
            },
            {
                label: 'THE BATAIREACHT SOURCE & FAIRY GUARDIANS', days: [
                    {
                        n: 3, date: 'Day 3', loc: 'Dublin \u2192 Shillelagh', type: 'travel', title: 'Through the Defensive Landscape', img: I.blackthorn,
                        lat: 53.0117, lng: -6.3275, zoom: 11, city: 'dublin',
                        events: ['Drive R755 through the Wicklow Mountains', 'Glendalough: 6th-century Round Tower\u2014defensive architecture masterclass', 'St. Kevin\'s Bed: Bronze Age cave where the saint lived', 'The Deer Stone: bullaun stone where women knelt to pray', 'Stay: Shillelagh village'],
                        prose: '<p class="prose-p">We drive the <strong>R755</strong> through the Wicklow Mountains\u2014granite passes that funnelled every invasion since the Vikings. <strong>Glendalough</strong> sits in a glacial valley with a 6th-century Round Tower rising above two dark lakes. The monastic settlement is beautiful, but the layer beneath it is older and more territorial.</p><p class="prose-p"><strong>St. Kevin\'s Bed</strong> is a Bronze Age cave 30 feet above the upper lake. The <strong>Deer Stone</strong> is a bullaun stone where women once knelt to pray for children. These sacred sites predate Christianity by millennia\u2014Kevin just moved in. We end the day in Shillelagh, the village that gave the weapon its name. Everything from here forward connects to the blackthorn stick, the landscape that grew it, and the people who fought with it.</p>'
                    },
                    {
                        n: 4, date: 'Day 4', loc: 'Shillelagh', type: 'partner', title: 'The Loaded Grip & The Lunantishees',
                        lat: 52.7500, lng: -6.5333, zoom: 13, city: 'shillelagh',
                        events: ['Morning: 1-on-1 Bataireacht tactical session', 'Lead-hand "loaded" grip and high-guard defensive mechanics', 'Weapon source: blackthorn (Straif in Ogham)', 'Tree of the Morrigan and the Cailleach', 'Afternoon: Coolattin Woods\u2014old-growth blackthorn & oak', 'Lunantishees: moon fairies who guard the trees'],
                        prose: '<p class="prose-p">We train in <strong>Bataireacht</strong>\u2014Irish Stick Fighting\u2014with private instruction. You learn the lead-hand loaded grip, the high guard, and the physics of managing reach with a blackthorn stick. This is not a demonstration. You hold the weapon, you drill the mechanics, and you feel what a controlled strike actually is.</p><p class="prose-p">The weapon itself is <strong>blackthorn</strong> (<em>Straif</em> in the Ogham alphabet)\u2014the tree of the <strong>Morr\u00edgan</strong> and the <strong>Cailleach</strong>, who strikes the ground with her blackthorn staff to summon winter. In the afternoon we walk <strong>Coolattin Woods</strong>, the old-growth forests that supplied the wood. The <strong>lunantishees</strong>\u2014moon fairies who guard these trees\u2014are part of the mythology surrounding the weapon\'s origin. The folklore and the fighting are inseparable here.</p>'
                    },
                    {
                        n: 5, date: 'Day 5', loc: 'Shillelagh', type: 'cultural', title: 'Material Science & The Chimney Cure', img: I.blackthorn,
                        lat: 52.7500, lng: -6.5333, zoom: 14, city: 'shillelagh',
                        events: ['Master Stickmaker\'s Workshop (O\'Caidhla Family)', 'Blackthorn seasoning: 3-5 years, or the accelerated chimney cure', 'Butter and dung heaps, the "cubby hole up a chimney" for 12 months', 'The S\u00edol Ealaigh bloodline: seed of the original warrior lineage', 'Rucking: conditioning on local R-roads'],
                        prose: '<p class="prose-p">We visit the <strong>O\'Caidhla family</strong> workshop. They hold the <strong>S\u00edol Ealaigh</strong> bloodline\u2014"the seed of Ealach," the original warrior lineage that gave the village its name. This is not a museum. It is a working stickmaker\'s shop where you watch the blackthorn go from raw branch to finished weapon.</p><p class="prose-p">The seasoning takes 3\u20135 years, or the accelerated chimney cure: the stick buried in butter and dung, then hung in a chimney for twelve months. Living wood becomes dead weapon through fire, fat, and time. You will understand why this object carried the weight it did\u2014and why so few people still know how to make one properly.</p>'
                    },
                    {
                        n: 6, date: 'Day 6', loc: 'Shillelagh', type: 'cultural', title: 'The Dying Lineage & The Clearances',
                        lat: 52.7500, lng: -6.5333, zoom: 13, city: 'shillelagh',
                        events: ['Deep-dive: Doyle and Antrim oral lineages', 'Coolattin estate: Fitzwilliam systematic clearances during the Famine', 'S\u00edol Ealaigh warriors became landless laborers', 'Stick-fighting as last residue of martial identity', 'The O\'Caidhla workshop as mausoleum'],
                        prose: '<p class="prose-p">Today we go deeper into the history of this place. The <strong>Coolattin Woods</strong> were part of the <strong>Fitzwilliam estate</strong>, where tenants were systematically cleared during the Famine. The warriors of the S\u00edol Ealaigh became landless laborers, and their stick-fighting tradition became the last residue of a martial identity that had no other outlet.</p><p class="prose-p">What remains in Shillelagh is material culture at its twilight. The Doyle system survives in Canada; the Antrim system is fragmenting. We sit in pubs that hold what oral tradition is left and listen to people who remember things that were never written down. This is documentary fieldwork as much as travel\u2014the kind of encounter you cannot manufacture or repeat.</p>'
                    },
                ]
            },
            {
                label: 'REBEL SOUTH & THE LAST FACTION FIGHTS', days: [
                    {
                        n: 7, date: 'Day 7', loc: 'Shillelagh \u2192 Cork', type: 'travel', title: 'The Rebel Push',
                        lat: 51.8969, lng: -8.4863, zoom: 12, city: 'cork',
                        events: ['2.5-hour drive south into the heart of the "Rebel County"', 'Stay: Cork City center'],
                        prose: '<p class="prose-p">We drive south through Carlow, Kilkenny, and the limestone uplands of Tipperary into <strong>Cork</strong>\u2014the "Rebel County." We are leaving the source territory of the weapon and entering the performance territory, where the stick was actually used in pitched faction fights at fairs and crossroads.</p><p class="prose-p">Cork\'s rebellion tradition runs from the Desmond Wars through the War of Independence. The aggression is in the cadence of the speech, the pace of the streets, and the music. You feel the shift the moment you arrive. The landscape changes, and so does the energy.</p>'
                    },
                    {
                        n: 8, date: 'Day 8', loc: 'Cork', type: 'cultural', title: 'Aggressive Cadence & Underground Tunnels',
                        lat: 51.8969, lng: -8.4863, zoom: 13, city: 'cork',
                        events: ['Evening: Sin \u00c9 \u2014 traditional session', 'Aggressive cadence of the music mirrors strike-rhythm of Bata drills', '19th-century underground tunnels beneath old merchant quarters', 'Ballinhassig Faction Fight of June 30, 1845\u201411 dead', 'The end of the tradition: recreational violence crushed by state force'],
                        prose: '<p class="prose-p">We spend the evening at <strong>Sin \u00c9</strong>, one of the best traditional music pubs in Ireland. The aggressive cadence of Cork trad mirrors the strike-rhythm of the Bata drills\u2014same tempo, same controlled intensity. Beneath the city, 19th-century tunnels run under the old merchant quarters, and we explore what is accessible.</p><p class="prose-p">The historical anchor here is the <strong>Ballinhassig Faction Fight of 1845</strong>\u2014just before the Famine\u2014one of the last major faction fights, where eleven people died when police opened fire on the crowd. This is where the tradition ended: recreational violence crushed by state force at the same moment the Famine crushed the peasant class that sustained it. We read from period accounts to bring the scene to life.</p>'
                    },
                    {
                        n: 9, date: 'Day 9', loc: 'Cork / Midleton', type: 'cultural', title: 'Midleton Distillery & The American Oak',
                        lat: 51.9145, lng: -8.1728, zoom: 12, city: 'cork',
                        events: ['Day trip to Jameson Midleton Distillery', 'Pot-still distillation & ex-bourbon barrel maturation', 'Redbreast / Midleton Very Rare', 'Ex-bourbon barrels: the American thread\u2014same oak forests', 'Film: massive copper stills, industrial scale vs. rural woods', 'Return to Cork'],
                        prose: '<p class="prose-p">We visit <strong>Jameson Midleton Distillery</strong> for the full production tour\u2014pot-still distillation and ex-bourbon barrel maturation. Tastings include <strong>Redbreast</strong> and <strong>Midleton Very Rare</strong>. The massive copper stills are visually extraordinary, and the scale of the operation is a striking contrast to the rural craft we saw in Wicklow.</p><p class="prose-p">The ex-bourbon barrels connect Ireland to the American whiskey tradition\u2014the same oak forests, the same coopering techniques, the same wood traveling west across the Atlantic alongside the Irish diaspora. It is a quieter day after the intensity of the south, and the whiskey earns it.</p>'
                    },
                ]
            },
            {
                label: 'THE WESTERN CORE & THE FAIRY QUEEN\'S LAKE', days: [
                    {
                        n: 10, date: 'Day 10', loc: 'Cork \u2192 Limerick', type: 'travel', title: 'Agrarian Violence & The Cailleach',
                        lat: 52.6638, lng: -8.6267, zoom: 11, city: 'limerick',
                        events: ['Drive northwest to the Shannon region', 'Day trip: Bunratty Castle & Folk Park', '19th-century rural village\u2014peak faction fighting era', 'Medieval Banquet: 15th-century castle under candlelight', 'Alternative: film the folk park\'s rural village after hours', 'Stay: Limerick'],
                        prose: '<p class="prose-p">We stop at <strong>Bunratty Castle \u0026 Folk Park</strong>, which reconstructs the 19th-century rural village\u2014the exact period of peak faction fighting. Walking through the thatched cottages and mud-walled farmsteads, you see the world the stick-fighters actually lived in. These were not knights. They were landless laborers who fought for reputation at fairs and crossroads with nothing but a blackthorn stick and their name.</p><p class="prose-p">The <strong>Medieval Banquet</strong> at the 15th-century castle is optional\u2014candlelight, vaulted ceilings, period performance. But the folk park itself is the more honest location, and wandering it at dusk is one of the quieter, more atmospheric moments on the trip.</p>'
                    },
                    {
                        n: 11, date: 'Day 11', loc: 'Lough Gur', type: 'cultural', title: 'The Warrior Poet & The Raped Goddess', img: I.stonecircle,
                        lat: 52.5175, lng: -8.5317, zoom: 13, city: 'limerick',
                        events: ['Day trip from Limerick to Lough Gur', '9,000 years of habitation', '\u00c1ine\'s lake\u2014fairy queen forced into marriage, bit off the Earl\'s ear', 'Ge\u00e1roid Iarla: rides from the lake every 7 years on a white horse', 'Suideach\u00e1n Bean-t\u00ed: sit in the Housekeeper\'s Chair and lose your wits', 'Grange Stone Circle: 113 stones, 40-ton central stone', 'Rannach Crom Dubh\u2014the Division of the dark sacrifice god'],
                        prose: '<p class="prose-p">We spend the day at <strong>Lough Gur</strong>\u20149,000 years of continuous habitation on a lake steeped in mythology. This is <strong>\u00c1ine\'s lake</strong>\u2014the fairy queen and goddess of love, who according to legend was forced into marriage with the Earl of Desmond. She bit off his ear (disqualifying him from kingship), and their son <strong>Ge\u00e1roid Iarla</strong> is said to ride from the lake on a white horse every seven years until his silver horseshoes wear through.</p><p class="prose-p">The <strong>Grange Stone Circle</strong> is the largest in Ireland\u2014113 stones, with a central stone weighing 40 tons, aligned with the summer solstice. Standing inside it in silence is one of those moments where the scale of what you are looking at overwhelms the frame. Bronze Age shields were found buried in the lake mud nearby. This is the landscape W.B. Yeats wrote about\u2014the territory where myth and archaeology overlap and neither fully explains the other.</p>'
                    },
                    {
                        n: 12, date: 'Day 12', loc: 'Cashel \u2192 Dublin', type: 'finale', title: 'Iron Sword vs. Blackthorn Stick',
                        lat: 52.5200, lng: -7.8897, zoom: 9, city: 'cashel',
                        events: ['Day trip: Rock of Cashel\u2014seat of the High Kings', 'The final contrast: sacralized Iron Age warrior vs. dispossessed stick-fighter', 'The Cailleach strikes the ground with her blackthorn staff to begin winter', 'Drive to Dublin Airport, return vehicle', 'Prep for departure'],
                        prose: '<p class="prose-p">We close the trip at the <strong>Rock of Cashel</strong>\u2014the seat of the High Kings of Munster, rising from the Tipperary plain like a stone crown. This is where the journey\'s arc completes: from the sacralized kings preserved in the bog at the National Museum to the dispossessed stick-fighters of the 19th century, the full spectrum of Irish martial identity is visible from this rock.</p><p class="prose-p">Over twelve days we have traced the weapon from fairy-guarded wood to chimney-cured stick, from ancient warrior lineage to dying tradition. The Cailleach strikes the ground with her blackthorn staff to begin winter, and this is where we leave Ireland\u2014driving northeast to Dublin Airport with the landscape still in the window. What you carry home from this trip is not a souvenir. It is a way of seeing a place that most visitors never access.</p>'
                    },
                ]
            },
        ];
        const ALL = SECTIONS.flatMap(s => s.days);

        /* ROUTES */
        const WICKLOW = [[53.3498, -6.2603], [53.2027, -6.0987], [53.0608, -6.2222], [53.0117, -6.3275], [52.9308, -6.2283], [52.7500, -6.5333]];
        const SOUTH = [[52.7500, -6.5333], [52.8408, -6.9261], [52.6542, -7.2522], [52.3800, -7.7500], [51.8969, -8.4863]];
        const MIDLETON_RD = [[51.8969, -8.4863], [51.9145, -8.1728]];
        const WEST = [[51.8969, -8.4863], [52.2000, -8.6200], [52.6638, -8.6267]];
        const LOUGHGUR_RD = [[52.6638, -8.6267], [52.5175, -8.5317]];
        const RET = [[52.6638, -8.6267], [52.5200, -7.8897], [52.6800, -7.5500], [52.8600, -7.1500], [53.0300, -6.8200], [53.2200, -6.4400], [53.3498, -6.2603]];

        const BOUNDS = L.latLngBounds([51.0, -11.0], [55.5, -5.0]);
        const map = L.map('map', { center: [53.0, -7.5], zoom: 7, minZoom: 6, maxZoom: 16, zoomControl: false, maxBounds: BOUNDS, maxBoundsViscosity: 0.85 });
        L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; <a href="https://openstreetmap.org">OSM</a> &copy; <a href="https://carto.com">CARTO</a>',
            subdomains: 'abcd', maxZoom: 19
        }).addTo(map);
        L.control.zoom({ position: 'bottomright' }).addTo(map);

        /* Dim routes */
        const dim = { color: '#1a3d2a', weight: 1.5, opacity: 0.5 };
        const scenicDim = { color: '#1a3d2a', weight: 1.2, opacity: 0.4, dashArray: '4,6' };
        L.polyline(WICKLOW, scenicDim).addTo(map);
        L.polyline(SOUTH, dim).addTo(map);
        L.polyline(MIDLETON_RD, dim).addTo(map);
        L.polyline(WEST, dim).addTo(map);
        L.polyline(LOUGHGUR_RD, dim).addTo(map);
        L.polyline(RET, dim).addTo(map);

        /* Active routes */
        const aMain = L.polyline([], { color: '#059669', weight: 3.5, opacity: 0.95, lineCap: 'round' }).addTo(map);
        const aScenic = L.polyline([], { color: '#34d399', weight: 3, opacity: 0.95, dashArray: '6,8', lineCap: 'round' }).addTo(map);

        const ROUTE_SEGS = [
            { day: 1, m: [], s: [] },
            { day: 3, m: [], s: WICKLOW },
            { day: 7, m: SOUTH, s: WICKLOW },
            { day: 9, m: [...SOUTH, ...MIDLETON_RD], s: WICKLOW },
            { day: 10, m: [...SOUTH, ...MIDLETON_RD, ...WEST], s: WICKLOW },
            { day: 11, m: [...SOUTH, ...MIDLETON_RD, ...WEST, ...LOUGHGUR_RD], s: WICKLOW },
            { day: 12, m: [...SOUTH, ...MIDLETON_RD, ...WEST, ...LOUGHGUR_RD, [52.6638, -8.6267], ...RET], s: WICKLOW },
        ];
        function updateRoute(n) { let seg = ROUTE_SEGS[0]; for (let i = 0; i < ROUTE_SEGS.length; i++) { if (n >= ROUTE_SEGS[i].day) seg = ROUTE_SEGS[i]; } aMain.setLatLngs(seg.m); aScenic.setLatLngs(seg.s); }

        /* STAY CITIES (overnight) */
        const CITIES = {
            dublin: { lat: 53.3498, lng: -6.2603, name: 'Dublin' },
            shillelagh: { lat: 52.7500, lng: -6.5333, name: 'Shillelagh' },
            cork: { lat: 51.8969, lng: -8.4863, name: 'Cork' },
            limerick: { lat: 52.6638, lng: -8.6267, name: 'Limerick' },
            cashel: { lat: 52.5200, lng: -7.8897, name: 'Rock of Cashel' },
        };
        const cMkrs = {};
        Object.entries(CITIES).forEach(([k, c]) => {
            const m = L.circleMarker([c.lat, c.lng], { radius: 7, fillColor: '#059669', color: 'rgba(5,150,105,0.4)', weight: 8, opacity: 1, fillOpacity: 0.95 }).addTo(map);
            m.bindTooltip('<b>' + c.name + '</b>', { className: 'ct', permanent: false, direction: 'top' });
            m.on('click', () => { const d = ALL.filter(x => x.city === k); if (d.length > 0) { const cl = d.reduce((p, c) => Math.abs(c.n - activeDay) < Math.abs(p.n - activeDay) ? c : p); scrollTo(cl.n); } });
            cMkrs[k] = m;
        });

        /* POI MARKERS (places you visit / things you do) */
        const POIS = [
            { lat: 53.3405, lng: -6.2554, name: 'National Museum', color: '#ef4444' },
            { lat: 53.3382, lng: -6.2828, name: 'The Liberties', color: '#ef4444' },
            { lat: 53.0117, lng: -6.3275, name: 'Glendalough', color: '#ef4444' },
            { lat: 52.7600, lng: -6.5200, name: 'Coolattin Woods', color: '#34d399' },
            { lat: 51.9020, lng: -8.4700, name: 'Sin \u00c9', color: '#f59e0b' },
            { lat: 51.9145, lng: -8.1728, name: 'Midleton Distillery', color: '#f59e0b' },
            { lat: 52.6978, lng: -8.8081, name: 'Bunratty Castle', color: '#ef4444' },
            { lat: 52.5175, lng: -8.5317, name: 'Lough Gur / Grange Circle', color: '#34d399' },
            { lat: 52.5200, lng: -7.8897, name: 'Rock of Cashel', color: '#ef4444' },
        ];
        POIS.forEach(p => {
            const m = L.circleMarker([p.lat, p.lng], { radius: 4, fillColor: p.color, color: p.color, weight: 1.5, opacity: 0.8, fillOpacity: 0.7 }).addTo(map);
            m.bindTooltip(p.name, { className: 'poi-tip', permanent: false, direction: 'top' });
        });

        /* BUILD TIMELINE */
        const tl = document.getElementById('timeline');
        SECTIONS.forEach(sec => {
            const wrap = document.createElement('div');
            const lbl = document.createElement('div');
            lbl.className = 'sec-label'; lbl.textContent = sec.label; wrap.appendChild(lbl);
            sec.days.forEach(d => {
                const card = document.createElement('div');
                card.className = 'day-card ' + d.type;
                card.id = 'd' + d.n;
                card.dataset.n = d.n;
                card.setAttribute('role', 'button');
                card.setAttribute('tabindex', '0');
                card.innerHTML = (d.img ? `<div class="card-img-wrap"><img class="card-img" src="${d.img}" alt="${d.loc}" loading="lazy"><div class="card-img-overlay"></div></div>` : '') +
                    `<div class="card-top"><div class="day-num">${d.n}</div><div class="card-meta"><div class="card-date">${d.date}</div><div class="card-loc">${d.loc}</div></div></div>` +
                    `<div class="card-body"><div class="card-ttl">${d.title}</div><ul class="evts">${d.events.map(e => `<li>${e}</li>`).join('')}</ul></div>` +
                    `<div class="card-prose-mb">${d.prose || ''}</div>`;
                card.addEventListener('click', () => {
                    const isActive = card.classList.contains('active');
                    if (window.innerWidth <= 760 && isActive) {
                        card.classList.remove('active');
                    } else {
                        activate(d.n, true);
                    }
                });
                card.addEventListener('keydown', function (e) { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); activate(d.n, true); } });
                wrap.appendChild(card);
            });
            tl.appendChild(wrap);
        });

        /* CTA CARD */
        const cta = document.createElement('div');
        cta.className = 'cta-card';
        cta.innerHTML = '<h3>Join This Trip</h3><p>Travel with a filmmaker and literature professor through the archaeology of Irish violence and myth. Limited group size.</p><p style="margin-top: 10px; font-weight: 600; font-size: 14px; margin-bottom: 12px; color: var(--text);"><strong>$3,995</strong> per person<br><span style="font-size: 10px; font-weight: 400; color: var(--muted); opacity: 0.8;">*International flights not included</span></p><a href="https://docs.google.com/forms/d/e/1FAIpQLSfdWWbpqfl-k4JKedyTJF-JhbWG8_l2zguDloL9ea1veMnNxw/viewform" target="_blank" rel="noopener noreferrer" class="cta-btn">Express Interest \u2192</a>';
        tl.appendChild(cta);

        /* STATE */
        var activeDay = 0, lastCity = '';
        var scrollCooldown = false;
        var obs = new IntersectionObserver(function (entries) {
            if (scrollCooldown) return;
            entries.forEach(function (e) { if (e.isIntersecting) { var n = parseInt(e.target.dataset.n); if (n !== activeDay) { scrollCooldown = true; activate(n, false); setTimeout(function () { scrollCooldown = false; }, 400); } } });
        }, { root: document.getElementById('timeline'), rootMargin: '-20% 0px -75% 0px', threshold: 0 });
        document.querySelectorAll('.day-card').forEach(function (c) { obs.observe(c); });

        function activate(n, scroll) {
            activeDay = n;
            var day = ALL.find(function (d) { return d.n === n; }); if (!day) return;
            document.querySelectorAll('.day-card').forEach(function (c) { c.classList.remove('active'); });
            var card = document.getElementById('d' + n);
            if (card) { card.classList.add('active'); if (scroll) card.scrollIntoView({ block: 'center', behavior: 'smooth' }); }
            if (day.city !== lastCity) {
                var flyZoom = Math.min(day.zoom, 9);
                map.flyTo([day.lat, day.lng], flyZoom, { duration: 1.1, easeLinearity: 0.25 });
                lastCity = day.city;
                Object.entries(cMkrs).forEach(function (e) { var k = e[0], m = e[1]; m.setStyle(k === day.city ? { radius: 9, fillColor: '#059669', color: 'rgba(5,150,105,0.6)', weight: 10, fillOpacity: 1 } : { radius: 7, fillColor: '#059669', color: 'rgba(5,150,105,0.4)', weight: 8, fillOpacity: 0.95 }); });
            }
            updateRoute(n);
            document.getElementById('ib-day').textContent = 'Day ' + n;
            document.getElementById('ib-loc').textContent = day.loc;
            document.getElementById('ib-ttl').textContent = day.title;
            var imgEl = document.getElementById('info-img');
            if (day.img) { imgEl.style.display = 'block'; if (imgEl.src !== day.img) { imgEl.style.opacity = 0; setTimeout(function () { imgEl.src = day.img; imgEl.alt = day.loc; imgEl.style.opacity = 1; }, 200); } }
            else { imgEl.style.display = 'none'; }
            document.getElementById('info-prose').innerHTML = (day.prose || '');
            var pct = ((n - 1) / (ALL.length - 1)) * 100;
            document.getElementById('prog-fill').style.width = pct + '%';
            document.getElementById('day-ctr').textContent = 'Day ' + n + ' of ' + ALL.length;
        }
        function scrollTo(n) { var c = document.getElementById('d' + n); if (c) c.scrollIntoView({ behavior: 'smooth', block: 'center' }); activate(n, false); }
        setTimeout(function () { activate(1, false); }, 300);
    </script>

    <script>
        // Collapse legend on mobile
        if (window.innerWidth <= 760) {
            const legDetails = document.getElementById('legend-details');
            if (legDetails) legDetails.removeAttribute('open');
        }
    </script>
