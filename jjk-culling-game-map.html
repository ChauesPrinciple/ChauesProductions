  <style>
    :root {
      --bg: #020212;
      --panel: #04041e;
      --card: #06062a;
      --border: rgba(0,80,255,.2);
      --accent: #0050ff;
      --accent2: #cc0099;
      --accent-dim: rgba(0,80,255,.15);
      --text: #dde8ff;
      --muted: #505080;
      --prose: #9aabcc;
    }

    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      font-family: 'Raleway', sans-serif;
      background-color: var(--bg);
      color: var(--text);
      overflow: hidden;
    }

    #app {
      display: flex;
      height: 100vh;
    }

    #sidebar {
      width: 380px;
      background-color: var(--panel);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    #hdr {
      padding: 24px 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .eyebrow {
      font-size: 0.75rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .main-title {
      font-family: 'Cinzel', serif;
      font-size: 2rem;
      font-weight: 700;
      color: var(--accent);
      margin: 0 0 4px 0;
      line-height: 1.1;
    }

    .subtitle {
      font-size: 0.875rem;
      color: var(--prose);
      font-weight: 300;
      letter-spacing: 0.05em;
    }

    #legend {
      padding: 20px;
      border-bottom: 1px solid var(--border);
      flex-shrink: 0;
    }

    .legend-title {
      font-size: 0.75rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 12px;
    }

    .legend-items {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
    }

    .legend-swatch {
      width: 20px;
      height: 20px;
      border-radius: 3px;
      flex-shrink: 0;
      border: 1px solid rgba(255,255,255,0.1);
    }

    #ward-list {
      flex: 1;
      overflow-y: auto;
      padding: 0;
    }

    .ward-item {
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      cursor: pointer;
      transition: all 0.2s ease;
      background-color: transparent;
    }

    .ward-item:hover {
      background-color: var(--accent-dim);
    }

    .ward-item.active {
      background-color: var(--accent-dim);
      border-left: 3px solid var(--accent);
      padding-left: 17px;
    }

    .ward-number {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 4px;
    }

    .ward-name {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      margin: 0;
    }

    .ward-jp {
      font-size: 0.8rem;
      color: var(--prose);
      margin-top: 2px;
    }

    #map-wrap {
      flex: 1;
      position: relative;
      min-height: 0;
      overflow: hidden;
    }
    #map {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }
    .leaflet-container {
      width: 100% !important;
      height: 100% !important;
      background: #020212 !important;
    }
    .leaflet-control-zoom a {
      background: #06062a !important;
      color: #0050ff !important;
      border-color: rgba(0,80,255,.3) !important;
    }

    .leaflet-popup-content-wrapper {
      background-color: var(--card) !important;
      border-radius: 4px !important;
      border: 1px solid var(--border) !important;
      box-shadow: 0 8px 32px rgba(0,0,0,0.5) !important;
    }

    .leaflet-popup-content {
      color: var(--text) !important;
      font-family: 'Raleway', sans-serif !important;
      margin: 0 !important;
      font-size: 0.875rem !important;
    }

    .leaflet-popup-tip {
      background-color: var(--card) !important;
      border-top-color: var(--border) !important;
    }

    #info-panel {
      width: 300px;
      background-color: var(--card);
      border-left: 1px solid var(--border);
      overflow-y: auto;
      padding: 24px;
      flex-shrink: 0;
      display: flex;
      flex-direction: column;
    }

    .info-hidden {
      display: none;
    }

    .info-badge {
      display: inline-block;
      padding: 6px 12px;
      background-color: var(--accent-dim);
      border: 1px solid var(--accent);
      border-radius: 4px;
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--accent);
      font-weight: 600;
      margin-bottom: 16px;
    }

    .info-title {
      font-family: 'Cinzel', serif;
      font-size: 1.25rem;
      font-weight: 700;
      color: var(--accent);
      margin: 0 0 12px 0;
      line-height: 1.2;
    }

    .info-section {
      margin-bottom: 20px;
    }

    .info-label {
      font-size: 0.7rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: var(--muted);
      font-weight: 600;
      margin-bottom: 8px;
    }

    .info-value {
      font-size: 0.875rem;
      color: var(--prose);
      line-height: 1.5;
    }

    .info-list {
      list-style: none;
      margin: 0;
      padding: 0;
    }

    .info-list li {
      font-size: 0.875rem;
      color: var(--prose);
      padding: 4px 0;
      padding-left: 12px;
      position: relative;
    }

    .info-list li:before {
      content: "•";
      position: absolute;
      left: 0;
      color: var(--accent);
    }

    .energy-low { color: #22c55e; }
    .energy-moderate { color: #3b82f6; }
    .energy-high { color: #f59e0b; }
    .energy-extreme { color: #ef4444; }


    /* Scrollbar */
    #ward-list::-webkit-scrollbar,
    #info-panel::-webkit-scrollbar {
      width: 6px;
    }

    #ward-list::-webkit-scrollbar-track,
    #info-panel::-webkit-scrollbar-track {
      background: transparent;
    }

    #ward-list::-webkit-scrollbar-thumb,
    #info-panel::-webkit-scrollbar-thumb {
      background: var(--accent);
      border-radius: 3px;
    }

    #ward-list::-webkit-scrollbar-thumb:hover,
    #info-panel::-webkit-scrollbar-thumb:hover {
      background: var(--accent2);
    }

    /* Barrier tooltips */
    .barrier-tooltip {
      background: #0a0a20 !important;
      border: 1px solid rgba(124,58,237,.4) !important;
      color: #e2e8f0 !important;
      font-family: 'Raleway', sans-serif !important;
      font-size: 12px !important;
      border-radius: 4px !important;
      box-shadow: 0 0 12px rgba(124,58,237,.3) !important;
    }
    .barrier-tooltip::before { display: none !important; }

    /* Culling Game Barrier animations */
    @keyframes barrier-pulse {
      0%   { stroke-opacity: 0.85; stroke-width: 3px; }
      50%  { stroke-opacity: 0.25; stroke-width: 6px; }
      100% { stroke-opacity: 0.85; stroke-width: 3px; }
    }
    @keyframes shibuya-pulse {
      0%   { stroke-opacity: 1; stroke-width: 2px; fill-opacity: 0.18; }
      50%  { stroke-opacity: 0.4; stroke-width: 5px; fill-opacity: 0.06; }
      100% { stroke-opacity: 1; stroke-width: 2px; fill-opacity: 0.18; }
    }
    .colony-1-barrier path {
      animation: barrier-pulse 3s ease-in-out infinite;
      stroke: #a855f7 !important;
    }
    .colony-2-barrier path {
      animation: barrier-pulse 3.4s ease-in-out infinite;
      stroke: #60a5fa !important;
    }
    .shibuya-barrier path {
      animation: shibuya-pulse 2s ease-in-out infinite;
      stroke: #f97316 !important;
    }

    /* Responsive */
    @media (max-width: 760px) {
      #app {
        flex-direction: column;
      }

      #sidebar {
        width: 100%;
        height: 50vh;
        border-right: none;
        border-bottom: 1px solid var(--border);
      }

      #map-wrap {
        height: 50vh;
        flex-direction: column;
      }

      #info-panel {
        width: 100%;
        height: 100%;
        border-left: none;
        border-top: 1px solid var(--border);
      }

      .legend-items {
        grid-template-columns: 1fr;
      }

      .main-title {
        font-size: 1.5rem;
      }
    }

    .subway-tip {
      background: #0a0a20 !important;
      border: 1px solid rgba(124,58,237,.3) !important;
      color: #e2e8f0 !important;
      font-family: 'Raleway', sans-serif !important;
      font-size: 11px !important;
      padding: 3px 8px !important;
      border-radius: 3px !important;
    }
    .subway-tip::before { display: none !important; }
  </style>

          // Overpass unavailable (local file) — use hardcoded station-level routes
          FALLBACK_SUBWAY.forEach(l=>{
            L.polyline(l.coords,{color:l.color,weight:l.w,opacity:0.85,lineJoin:'round',lineCap:'round'})
              .bindTooltip(l.name,{sticky:true,className:'subway-tip'}).addTo(map);
          });
        });
    }


    // Init on load
    window.addEventListener('load', function() {
      if (typeof L === 'undefined') {
        var m = document.getElementById('map');
        if (m) { m.style.cssText='background:#060614;display:flex;align-items:center;justify-content:center'; m.innerHTML='<p style="color:#7c3aed;font-family:Raleway,sans-serif;font-size:13px;padding:20px;text-align:center"><strong>⚠ Map library failed to load</strong><br><small>Leaflet could not be fetched from the CDN.<br>Check your internet connection and reload.</small></p>'; }
        return;
      }
      initMap();
    });
  </script>
</body>
</html>
